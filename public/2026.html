<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srećna Nova 2026. godina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: 40px 30px 30px;
            text-align: center;
            border-bottom: 3px solid #ED3237;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 30px;
        }

        .year-section {
            background: white;
            padding: 50px 30px;
            text-align: center;
        }

        .year-display {
            font-size: 120px;
            font-weight: 700;
            color: #ED3237;
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .message-section {
            padding: 40px 40px 50px;
            background: #ffffff;
            text-align: center;
        }

        .greeting {
            font-size: 24px;
            color: #373435;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .message {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .decorative-line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ED3237, transparent);
            margin: 30px auto;
        }

        .footer {
            background: #373435;
            color: white;
            padding: 25px 30px;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        .footer-website {
            color: #ED3237;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .year-display {
                font-size: 80px;
            }

            .greeting {
                font-size: 20px;
            }

            .message {
                font-size: 15px;
            }

            .message-section {
                padding: 30px 25px;
            }
        }
    </style>
</head>

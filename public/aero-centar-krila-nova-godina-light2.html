<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srećna Nova Godina 2026 - Aero Centar Krila d.o.o. (WOW Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(237, 50, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.06) 0%, transparent 50%),
                linear-gradient(135deg, #f8f9fa 0%, #ffffff 50%, #f0f4ff 100%);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        html::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(255, 255, 255, 0.5) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(237, 50, 55, 0.6), rgba(255, 215, 0, 0.4));
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(237, 50, 55, 0.4);
        }

        .star:nth-child(1) { top: 10%; left: 20%; animation-delay: 0s; }
        .star:nth-child(2) { top: 20%; left: 80%; animation-delay: 0.3s; }
        .star:nth-child(3) { top: 5%; left: 50%; animation-delay: 0.6s; }
        .star:nth-child(4) { top: 30%; left: 10%; animation-delay: 0.9s; }
        .star:nth-child(5) { top: 15%; left: 70%; animation-delay: 1.2s; }
        .star:nth-child(6) { top: 25%; left: 40%; animation-delay: 1.5s; }
        .star:nth-child(7) { top: 8%; left: 90%; animation-delay: 0.2s; }
        .star:nth-child(8) { top: 35%; left: 60%; animation-delay: 0.8s; }
        .star:nth-child(9) { top: 12%; left: 30%; animation-delay: 1.1s; }
        .star:nth-child(10) { top: 28%; left: 85%; animation-delay: 0.4s; }
        .star:nth-child(11) { top: 40%; left: 5%; animation-delay: 1.7s; }
        .star:nth-child(12) { top: 45%; left: 95%; animation-delay: 0.5s; }

        @keyframes twinkle {
            0%, 100% { 
                opacity: 0.3; 
                transform: scale(1) rotate(0deg); 
                filter: brightness(1);
            }
            50% { 
                opacity: 1; 
                transform: scale(1.8) rotate(180deg); 
                filter: brightness(1.5);
            }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                0 2px 8px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            padding: 60px 40px;
            max-width: 900px;
            width: 100%;
            position: relative;
            overflow: hidden;
            animation: cardFloat 6s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(237, 50, 55, 0.05) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .glass-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #ED3237 20%, 
                #ffd700 50%, 
                #ED3237 80%, 
                transparent 100%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .logo-container {
            margin-bottom: 50px;
            animation: fadeInDown 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            position: relative;
            z-index: 2;
        }

        .logo-container svg {
            width: 320px;
            height: auto;
            filter: 
                drop-shadow(0 15px 35px rgba(237, 50, 55, 0.25))
                drop-shadow(0 5px 15px rgba(0, 0, 0, 0.1));
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-container:hover svg {
            transform: scale(1.05) translateY(-5px);
            filter: 
                drop-shadow(0 20px 45px rgba(237, 50, 55, 0.35))
                drop-shadow(0 8px 20px rgba(0, 0, 0, 0.15));
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .year-display {
            position: relative;
            margin-bottom: 40px;
            animation: scaleIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
            z-index: 2;
        }

        @keyframes scaleIn {
            from { 
                opacity: 0; 
                transform: scale(0.5) rotateX(-20deg);
            }
            to { 
                opacity: 1; 
                transform: scale(1) rotateX(0deg);
            }
        }

        .year {
            font-family: 'Playfair Display', serif;
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 900;
            background: linear-gradient(135deg, 
                #ED3237 0%, 
                #ff6b6b 25%,
                #ffd700 50%,
                #ff6b6b 75%,
                #ED3237 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 4s ease infinite, pulse 2s ease-in-out infinite;
            line-height: 1;
            letter-spacing: 0.02em;
            position: relative;
            text-shadow: 0 0 80px rgba(237, 50, 55, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .greeting {
            animation: fadeInUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .greeting h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, #1a1a1a 0%, #ED3237 50%, #1a1a1a 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 0.02em;
            line-height: 1.3;
            animation: textShine 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes textShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .greeting h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ED3237, transparent);
            border-radius: 2px;
        }

        .greeting h2 {
            font-size: 1.5rem;
            font-weight: 300;
            color: rgba(12, 30, 66, 0.72);
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        .divider {
            width: 150px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ED3237, #ffd700, #ED3237, transparent);
            margin: 40px auto;
            animation: fadeIn 1.5s ease-out 0.9s both, expandWidth 2s ease-in-out infinite;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(237, 50, 55, 0.4);
            position: relative;
            z-index: 2;
        }

        @keyframes expandWidth {
            0%, 100% { width: 150px; opacity: 0.8; }
            50% { width: 180px; opacity: 1; }
        }

        .message {
            max-width: 680px;
            font-size: 1.15rem;
            line-height: 1.9;
            color: rgba(26, 26, 26, 0.75);
            font-weight: 400;
            animation: fadeIn 1.5s ease-out 1.2s both;
            margin-bottom: 50px;
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        .message::before {
            content: '"';
            position: absolute;
            top: -20px;
            left: 0;
            font-size: 4rem;
            color: rgba(237, 50, 55, 0.15);
            font-family: 'Playfair Display', serif;
            line-height: 1;
        }

        .firework {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: firework 1.5s ease-out infinite;
        }

        .firework::before,
        .firework::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
        }

        .firework:nth-child(1) {
            top: 15%;
            left: 8%;
            color: rgba(237, 50, 55, 1);
            background: currentColor;
            animation-delay: 0s;
            filter: blur(0.5px);
        }

        .firework:nth-child(2) {
            top: 12%;
            right: 12%;
            color: rgba(255, 215, 0, 1);
            background: currentColor;
            animation-delay: 0.6s;
            filter: blur(0.5px);
        }

        .firework:nth-child(3) {
            top: 25%;
            right: 8%;
            color: rgba(237, 50, 55, 0.95);
            background: currentColor;
            animation-delay: 1.2s;
            filter: blur(0.5px);
        }

        @keyframes firework {
            0% {
                transform: scale(0);
                opacity: 1;
                box-shadow:
                    0 0 0 0 currentColor,
                    0 -30px 0 0 currentColor,
                    0 30px 0 0 currentColor,
                    30px 0 0 0 currentColor,
                    -30px 0 0 0 currentColor,
                    21px -21px 0 0 currentColor,
                    21px 21px 0 0 currentColor,
                    -21px -21px 0 0 currentColor,
                    -21px 21px 0 0 currentColor;
            }
            50% {
                transform: scale(1);
                opacity: 1;
                box-shadow:
                    0 0 0 0 currentColor,
                    0 -50px 0 -2px currentColor,
                    0 50px 0 -2px currentColor,
                    50px 0 0 -2px currentColor,
                    -50px 0 0 -2px currentColor,
                    35px -35px 0 -2px currentColor,
                    35px 35px 0 -2px currentColor,
                    -35px -35px 0 -2px currentColor,
                    -35px 35px 0 -2px currentColor;
            }
            100% {
                transform: scale(1);
                opacity: 0;
                box-shadow:
                    0 0 0 -2px currentColor,
                    0 -70px 0 -2px currentColor,
                    0 70px 0 -2px currentColor,
                    70px 0 0 -2px currentColor,
                    -70px 0 0 -2px currentColor,
                    50px -50px 0 -2px currentColor,
                    50px 50px 0 -2px currentColor,
                    -50px -50px 0 -2px currentColor,
                    -50px 50px 0 -2px currentColor;
            }
        }

        .company-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            border: 1px solid rgba(237, 50, 55, 0.2);
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            animation: fadeIn 1.5s ease-out 1.5s both;
            position: relative;
            z-index: 2;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .company-badge:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 12px 32px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .company-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ED3237, #ff6b6b);
            box-shadow: 
                0 0 0 4px rgba(237, 50, 55, 0.15),
                0 0 20px rgba(237, 50, 55, 0.4);
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .company-badge .name {
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.95rem;
            color: #1a1a1a;
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 40px 24px;
                border-radius: 24px;
            }

            .logo-container svg {
                width: 240px;
            }

            .greeting h1 {
                letter-spacing: 0.01em;
            }

            .message {
                font-size: 1rem;
                padding: 0 10px;
            }

            .company-badge {
                padding: 12px 24px;
                gap: 10px;
            }

            .company-badge .name {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
